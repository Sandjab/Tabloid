name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run type-check
      - run: npm run build
      # Anonymous, cookie-free visit counter (GoatCounter) — injected into the
      # published copy only, never into the sources. The grep fails the build
      # if the injection touched nothing.
      - name: Inject visit counter
        run: |
          find dist -name '*.html' -exec sed -i 's|</body>|<script data-goatcounter="https://sandjab.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>\n</body>|' {} +
          grep -rl goatcounter dist --include='*.html' >/dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
